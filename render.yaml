services:
  - type: web
    name: copd-explorer-api
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: AI_PROVIDER
        value: deepseek
      - key: AI_TIMEOUT_SECONDS
        value: "30"
      - key: CORS_ORIGINS
        value: https://xzx1010.github.io
      - key: DEEPSEEK_API_KEY
        sync: false
